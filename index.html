<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A Special Message 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --pink: #ff4d6d;
            --glass: rgba(255, 255, 255, 0.4);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ee9ca7 0%, #ffdde1 100%);
            font-family: 'Quicksand', sans-serif;
            overflow: hidden;
            transition: background 0.8s ease;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 2.5rem 1.5rem;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
            width: 350px;
            max-width: 90%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            color: #d63384;
            font-size: 2.2rem;
            margin: 10px 0 20px 0;
        }

        .gif-box {
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }

        .gif-box img {
            max-width: 150px;
            border-radius: 20px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px; /* Critical: This keeps the buttons separated as they grow */
            align-items: center;
            width: 100%;
        }

        #yesBtn {
            background: var(--pink);
            color: white;
            border: none;
            padding: 15px 35px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(255, 77, 109, 0.3);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #noBtn {
            background: white;
            color: #999;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .unclickable {
            background: #eee !important;
            color: #bbb !important;
            pointer-events: none;
        }

        .hidden { display: none; }

        /* Floating Hearts Animation */
        .heart-float {
            position: absolute;
            pointer-events: none;
            z-index: 1;
            animation: drift 6s linear infinite;
        }

        @keyframes drift {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="card">
        <div id="askSection">
            <div class="gif-box">
                <img id="mainGif" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp1eXF5cTF5eXF5eXF5eXF5eXF5eXF5eXF5eXF5eXF5ZCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/cLS1zl2mGLec9v7pMa/giphy.gif" alt="Waiting Cat">
            </div>
            <h1>Will you be my Valentine? 💖</h1>
            <div class="btn-group">
                <button id="yesBtn">YES! ✨</button>
                <button id="noBtn">No</button>
            </div>
        </div>

        <div id="successSection" class="hidden">
            <div class="gif-box">
                <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp1eXF5cTF5eXF5eXF5eXF5eXF5eXF5eXF5eXF5eXF5ZCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/MDJ9IbM3vuzS6tVwLp/giphy.gif" alt="Happy Cat">
            </div>
            <h1>Yay! I knew it! ❤️</h1>
            <p style="color: #d63384; font-weight: bold;">I love you! 🥰</p>
        </div>
    </div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const askSection = document.getElementById('askSection');
        const successSection = document.getElementById('successSection');

        let clickCount = 0;
        let pVertical = 15;
        let pHorizontal = 35;
        let fSize = 1.2;

        const phrases = ["No", "Are you sure?", "Absolutely sure?"];
        const hearts = ['❤️', '💖', '💝', '💕', '💗'];

        // Grow Yes Button physically
        noBtn.addEventListener('click', () => {
            clickCount++;
            
            pVertical += 12;
            pHorizontal += 20;
            fSize += 0.3;

            yesBtn.style.padding = `${pVertical}px ${pHorizontal}px`;
            yesBtn.style.fontSize = `${fSize}rem`;

            if (clickCount < 3) {
                noBtn.innerText = phrases[clickCount];
            } else {
                noBtn.innerText = "You don't have that option.";
                noBtn.classList.add('unclickable');
            }
        });

        // Celebration
        yesBtn.addEventListener('click', () => {
            askSection.classList.add('hidden');
            successSection.classList.remove('hidden');
            document.body.style.background = "linear-gradient(135deg, #ff4d6d 0%, #ee9ca7 100%)";

            const end = Date.now() + 3000;
            (function frame() {
              confetti({ 
                  particleCount: 3, 
                  angle: 60, 
                  spread: 55, 
                  origin: { x: 0, y: 0.8 }, 
                  colors: ['#ff4d6d', '#ffffff'] 
              });
              confetti({ 
                  particleCount: 3, 
                  angle: 120, 
                  spread: 55, 
                  origin: { x: 1, y: 0.8 }, 
                  colors: ['#ff4d6d', '#ffffff'] 
              });
              if (Date.now() < end) requestAnimationFrame(frame);
            }());
        });

        // Background Hearts
        function spawnHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart-float';
            heart.innerHTML = hearts[Math.floor(Math.random() * hearts.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
            heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 6000);
        }
        setInterval(spawnHeart, 400);
    </script>
</body>
</html>
